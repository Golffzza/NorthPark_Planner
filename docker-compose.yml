services:
  db:
    image: postgres:16-alpine
    container_name: northpark-planner-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northpark_planner
    volumes:
      - northpark_planner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northpark_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  northpark_planner_pgdata:
