# Disposable local E5.4 PostgreSQL. Never connect this container to production networks.
services:
  e5-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: e5_fixture
      POSTGRES_PASSWORD: e5_local_fixture_only
      POSTGRES_DB: northpark_e5_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e5_fixture -d northpark_e5_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"

  e5-shadow-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: e5_fixture
      POSTGRES_PASSWORD: e5_local_fixture_only
      POSTGRES_DB: northpark_e5_shadow_test
    ports:
      - "127.0.0.1:55440:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e5_fixture -d northpark_e5_shadow_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: "no"
